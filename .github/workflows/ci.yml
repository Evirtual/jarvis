name: CI

# Every push and pull request: the typecheck (the only thing that checks types —
# Vite and the test runner strip them), the unit tests, a full build — and the
# console end to end in Chrome, against a fake service (tests/e2e/console.mjs).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build client and server
        run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the web version
        run: npm run build:client:web
      - name: Run the console end to end
        run: npm run test:e2e
        env:
          JARVIS_BROWSER: /usr/bin/google-chrome
      - name: Keep the screenshots and the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: tests/e2e/out
