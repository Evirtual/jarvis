name: Pages

# Publishes the console to GitHub Pages on every push to main — the serverless
# build: no console server behind it. The browser talks to OpenAI, Anthropic
# or Google directly with the key the user connects (kept in their own
# browser), and measures what a browser can of the device it runs on.
#
# Repository variable (optional):
#   JARVIS_SITE_URL  https://jarvis.example.com  set once a custom domain serves
#                                                the page; until then it is
#                                                served under /<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the serverless client
        env:
          JARVIS_SITE_URL: ${{ vars.JARVIS_SITE_URL }}
          VITE_JARVIS_SERVERLESS: "1"
        run: |
          if [[ -n "$JARVIS_SITE_URL" ]]; then
            export JARVIS_BASE="/"
          else
            export JARVIS_BASE="/${{ github.event.repository.name }}/"
          fi
          echo "base=$JARVIS_BASE"
          npm run build:client
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
