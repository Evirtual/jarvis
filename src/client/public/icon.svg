<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="J.A.R.V.I.S.">
  <!-- JARVIS's core, simplified: the same rings, glow and gold triangle as the
       one drawn at the bottom of the console (stage.ts drawCore). -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0f2a36"/>
      <stop offset="1" stop-color="#050b11"/>
    </radialGradient>
    <radialGradient id="plasma" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6f2fa" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#6ff0ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#2e7f96" stop-opacity=".22"/>
      <stop offset="1" stop-color="#040810" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g transform="translate(256 256)" fill="none" stroke-linecap="round">
    <!-- outer ring: six segments -->
    <circle r="196" stroke="#2e7f96" stroke-width="14" stroke-dasharray="146 59" transform="rotate(-78)"/>
    <!-- middle ring: four bright segments -->
    <circle r="160" stroke="#6ff0ff" stroke-width="11" stroke-dasharray="163 88" transform="rotate(-35)"/>
    <!-- inner ring: twelve fine segments -->
    <circle r="128" stroke="#1d5468" stroke-width="6" stroke-dasharray="51 16"/>
    <!-- the plasma at the centre -->
    <circle r="112" fill="url(#plasma)" stroke="none"/>
    <!-- the gold triangle, with its glow -->
    <path d="M0 -66 L57.2 33 L-57.2 33 Z" stroke="#ffb648" stroke-opacity=".35" stroke-width="30" stroke-linejoin="round"/>
    <path d="M0 -66 L57.2 33 L-57.2 33 Z" stroke="#ffb648" stroke-width="13" stroke-linejoin="round"/>
  </g>
</svg>
