<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 52 408 408" role="img" aria-label="J.A.R.V.I.S.">
  <!-- JARVIS's core, simplified: the same rings, glow and gold triangle as the
       one drawn at the bottom of the console (stage.ts drawCore). No tile of
       its own: it sits on whatever it is shown on, light or dark, cropped to
       the outer ring. scripts/icons.mjs puts it on the dark ground below for
       the two icons a platform needs full-bleed (Android's maskable icon, the
       iPhone home screen). -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0f2a36"/>
      <stop offset="1" stop-color="#050b11"/>
    </radialGradient>
    <radialGradient id="plasma" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6f2fa" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#6ff0ff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#2e7f96" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2e7f96" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(256 256)" fill="none" stroke-linecap="round">
    <!-- outer ring: six segments -->
    <circle r="196" stroke="#2e7f96" stroke-width="14" stroke-dasharray="146 59" transform="rotate(-78)"/>
    <!-- middle ring: four bright segments (a shade deeper than on screen, so it holds on white) -->
    <circle r="160" stroke="#3fc9dc" stroke-width="11" stroke-dasharray="163 88" transform="rotate(-35)"/>
    <!-- inner ring: twelve fine segments -->
    <circle r="128" stroke="#2e7f96" stroke-opacity=".7" stroke-width="6" stroke-dasharray="51 16"/>
    <!-- the plasma at the centre -->
    <circle r="112" fill="url(#plasma)" stroke="none"/>
    <!-- the gold triangle: a fine line that carries its own weight, so it reads
         the same on white, where a glow disappears, as on dark, where it adds -->
    <path d="M0 -66 L57.2 33 L-57.2 33 Z" stroke="#ffb648" stroke-opacity=".22" stroke-width="16" stroke-linejoin="round"/>
    <path d="M0 -66 L57.2 33 L-57.2 33 Z" stroke="#ec9422" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
